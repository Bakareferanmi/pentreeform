<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6020c8">
<title>Pentreeform · Dashboard</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHBhdGggZmlsbD0iIzY5MjhkOSIgZD0iTTE4IDMgNDcgMTNRNTggMTcgNTggMjl2OVE1OCA1MSA0NSA0N0wyOSA0MlYzMGwxNSA1VjI0bC0yNi04ek03IDI5bDE3LTEwdjM2TDcgNjR6Ii8+PC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6020c8;--purple-600:#4e139f;--purple-700:#3e0f80;--purple-300:#b79bec;--purple-100:#ece0fd;--purple-50:#f6f1fe;
  --ink:#1c0f33;--ink-2:#2a1749;--text:#201729;--muted:#625773;--line:#e6ddf3;--line-2:#d3c7e6;
  --canvas:#f7f4fc;--card:#fff;
  --green:#09683d;--green-bg:#def6e9;--amber:#86500c;--amber-bg:#fff0d5;--red:#a3303f;--red-bg:#fde9ec;
  --shadow:0 1px 2px rgba(40,18,80,.04),0 8px 24px -10px rgba(40,18,80,.12);
  --r:16px;
  --display:'Manrope','DM Sans',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.55 var(--body);color:var(--text);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--purple);text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em}
svg{flex-shrink:0}
:focus-visible{outline:3px solid #a47ae8;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* preview bar */
.pbar{position:sticky;top:0;z-index:70;height:52px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#14092a;color:#fff;font-size:13px}
.pbar b{font-family:var(--display);font-weight:700}
.pbar span{color:#c9b8e6}
.pbar label{display:flex;align-items:center;gap:10px;margin-left:auto}
.pbar select{height:34px;border-radius:9px;border:1px solid #4a3470;background:#241342;color:#fff;padding:0 10px;font-size:12.5px}
.pbar small{color:#a994cc;font-size:11.5px}

/* shell */
.shell{display:flex;min-height:calc(100vh - 52px)}
.side{width:268px;flex-shrink:0;position:sticky;top:52px;height:calc(100vh - 52px);background:linear-gradient(180deg,var(--ink),#150a2b);color:#e9defa;display:flex;flex-direction:column;padding:22px 16px 16px;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;color:#fff;padding:0 8px}
.logo svg{width:28px;height:32px;color:#8a4dff}
.logo.dark{color:var(--purple)}.logo.dark svg{color:var(--purple)}
.ws{display:flex;align-items:center;gap:11px;width:100%;margin:24px 0 18px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:left}
.ws:hover{background:rgba(255,255,255,.1)}
.ws i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--purple);color:#fff;font:800 14px var(--display)}
.ws strong{flex:1;font-size:13.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws svg{color:#a995cc}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:13px;height:44px;padding:0 13px;border-radius:12px;color:#cdbfe6;font-weight:500;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--purple);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px rgba(96,32,200,.9)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:#fff;color:var(--purple);display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.nav button.on .cnt{background:#fff}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:12px 6px}
.side-bot{margin-top:auto;display:grid;gap:10px}
.plan{width:100%;text-align:left;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.plan:hover{background:rgba(255,255,255,.1)}
.plan .r{display:flex;justify-content:space-between;font-size:12.5px;color:#fff;margin-bottom:9px}
.plan .r span{color:#b9a8d9}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a4dff,#c3a3ff);border-radius:6px}
.plan small{display:block;margin-top:8px;color:#a995cc;font-size:11.5px}
.me{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:left}
.me:hover{background:rgba(255,255,255,.07)}
.me div{flex:1;min-width:0}
.me strong,.me small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me strong{font-size:13px;color:#fff}.me small{font-size:11.5px;color:#a995cc}
.me svg{color:#a995cc}

.main{flex:1;min-width:0}
.top{position:sticky;top:52px;z-index:30;height:60px;display:flex;align-items:center;gap:12px;padding:0 32px;background:rgba(247,244,252,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--text);font-weight:600}.crumb i{margin:0 9px;font-style:normal;color:var(--line-2)}
.top .grow{flex:1}
.burger{display:none}
.wrap{padding:26px 32px 40px;max-width:1360px;margin:0 auto}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:5px 12px 5px 10px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.live i{width:7px;height:7px;border-radius:50%;background:#22a36a;box-shadow:0 0 0 3px #d9f3e5}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0 24px;flex-wrap:wrap}
.head h1{font-size:32px;font-weight:800;line-height:1.15}
.head p{color:var(--muted);margin-top:6px;font-size:14.5px}
.acts{display:flex;gap:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 17px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;color:var(--purple-600);font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--purple);background:var(--purple-50)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 8px 18px -8px rgba(96,32,200,.8)}
.btn.pri:hover{background:var(--purple-600);border-color:var(--purple-600)}
.btn.pri:disabled{background:#e9e2f1;border-color:#d3c7e6;color:#76688a;box-shadow:none}
.btn.dng{color:#972d40;border-color:#e0b4bc}.btn.dng:hover{background:var(--red-bg);border-color:#972d40}
.btn.sm{height:36px;padding:0 13px;font-size:13px}
.ibtn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:11px;color:#52406c}
.ibtn:hover{background:var(--purple-100);color:var(--purple-600)}
.ibtn.bd{border:1.5px solid var(--line-2);background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--purple-100);color:var(--purple-600)}
.badge.g{background:var(--green-bg);color:var(--green)}.badge.a{background:var(--amber-bg);color:var(--amber)}.badge.r{background:var(--red-bg);color:var(--red)}
.muted{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:7px;margin:16px 0;font-weight:600;font-size:13px;color:#33224d}
.field input,.field textarea{height:46px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font-weight:400;font-size:14px;width:100%}
.field input:focus{border-color:var(--purple);outline:3px solid #e0d1f8}
.field input[readonly]{background:#f3eef9;color:#4c3c5d}
.field small{font-weight:400;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{display:flex;align-items:center;gap:16px;padding:18px 20px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--purple-100);color:var(--purple)}
.stat.g .ic{background:var(--green-bg);color:var(--green)}.stat.a .ic{background:var(--amber-bg);color:var(--amber)}
.stat strong{display:block;font:800 28px/1.1 var(--display);letter-spacing:-.03em}
.stat small{color:var(--muted);font-size:13px}

.alert{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:#fff8e8;border:1px solid #ecd29a;color:#6b4513;margin-bottom:18px;font-size:13.5px}
.alert svg{color:#a06a12}
.alert button{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--purple);font-weight:600;white-space:nowrap}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(380px,45%) 1fr;overflow:hidden;min-height:620px}
.lp{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.flt{display:flex;gap:8px;padding:16px 16px 12px;flex-wrap:wrap}
.search{flex:1 1 100%;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border-radius:12px;background:var(--canvas);border:1.5px solid transparent;color:#594c6c}
.search:focus-within{background:#fff;border-color:var(--purple)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.flt select{flex:1;height:38px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;font-size:13px;min-width:0}
.tabs{display:flex;align-items:center;gap:4px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.tabs button{height:34px;padding:0 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--purple-50)}
.tabs button.on{background:var(--purple);color:#fff}
.tabs button span{background:#fff;color:var(--purple);border-radius:99px;font-size:11.5px;padding:0 7px;line-height:18px}
.tabs .bulk{margin-left:auto;color:var(--purple-600);background:var(--purple-100)}
.list{overflow:auto;flex:1}
.row{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line);position:relative}
.row:hover{background:#fbf9ff}
.row.sel{background:var(--purple-50)}
.row.sel:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--purple)}
.cb{appearance:none;width:18px;height:18px;margin:10px 0 0;border:1.5px solid var(--line-2);border-radius:6px;background:#fff;display:grid;place-content:center;flex-shrink:0;cursor:pointer}
.cb:checked{background:var(--purple);border-color:var(--purple)}
.cb:checked:after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.open{flex:1;min-width:0;display:flex;gap:12px;text-align:left}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:700 13px var(--display);background:#e9ddff;color:#5a2db0;flex-shrink:0}
.av.c1{background:#e0eaff;color:#2f5aa0}.av.c2{background:#d9f2e5;color:#1f6445}.av.c3{background:#fde4de;color:#8a4a38}
.rb{flex:1;min-width:0}
.rt{display:flex;align-items:center;gap:8px}
.rt strong{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread .rt strong{font-weight:700}
.unread .rt:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0}
.rt small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.subj{font-size:13.5px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unread .subj{font-weight:600}
.snip{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .badge{margin-top:7px;height:22px;font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dot.delivered{background:#168044}.dot.failed{background:#c27a14}.dot.blocked{background:#a3444f}.dot.accepted,.dot.queued{background:#75529f}.dot.bounced,.dot.complained,.dot.suppressed{background:#a3444f}
.empty{padding:70px 24px;text-align:center;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--purple-100);color:var(--purple);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{color:var(--text);font-size:17px;margin-bottom:5px}
.empty .btn{margin-top:16px}
.dp{padding:26px 30px;min-width:0;overflow:auto}
.back{display:none;margin-bottom:16px}
.dh{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px}
.dh h2{flex:1;font-size:22px;line-height:1.3}
.ds{display:flex;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
.ds strong{display:block;font-size:14px}.ds small{color:var(--muted);font-size:12.5px}
.ds time{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
dl{margin:22px 0}
dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7a6c90;margin-bottom:6px}
dd{margin:0 0 20px;font-size:14px}
dd a{color:var(--text)}
.mbody{white-space:pre-wrap;line-height:1.8;background:var(--canvas);border-radius:14px;padding:16px;color:#3d2c55;overflow-wrap:anywhere}
.dcard{display:flex;align-items:center;gap:13px;padding:15px;border-radius:14px;background:var(--green-bg);border:1px solid #a7d8bc}
.dcard>svg{color:var(--green)}
.dcard strong{display:block;font-size:13.5px;color:#0b4f2f}.dcard small{color:#2d6a4b;font-size:12.5px}
.dcard.w{background:#fff8e8;border-color:#ecd29a}.dcard.w>svg{color:#a06a12}.dcard.w strong{color:#6b4513}.dcard.w small{color:#80622f}
.dcard.n{background:var(--purple-50);border-color:#d6c3f4}.dcard.n>svg{color:var(--purple)}.dcard.n strong{color:var(--purple-600)}.dcard.n small{color:#6a548d}
.dcard button{margin-left:auto;color:var(--purple);width:32px;height:32px;display:grid;place-items:center}
.reply{width:100%;margin-top:16px}

/* panels */
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ph h2{font-size:18px}
.ph button.lk{display:flex;align-items:center;gap:5px;color:var(--purple);font-weight:600;font-size:13px}
.orow{display:flex;align-items:center;gap:14px;width:100%;padding:16px 8px;border-top:1px solid var(--line);text-align:left;border-radius:10px}
.orow:hover{background:var(--purple-50)}
.orow>span:nth-child(2){flex:1;min-width:0}
.orow strong,.orow small{display:block}.orow small{color:var(--muted);font-size:13px}
.fic{width:44px;height:44px;border-radius:13px;background:var(--purple-100);color:var(--purple);display:grid;place-items:center}
.start{background:linear-gradient(160deg,var(--ink),var(--ink-2));color:#e9defa;border:0;position:relative;overflow:hidden}
.start:after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(138,77,255,.5),transparent 70%)}
.start h2{font-size:26px;color:#fff;margin:16px 0 8px;position:relative}
.start p{color:#c9b8e6;position:relative}
.start ol{list-style:none;padding:0;margin:22px 0;display:grid;gap:14px;position:relative}
.start li{display:flex;align-items:center;gap:11px;font-size:13.5px}
.start li svg{color:#b79bec}
.start .badge{background:rgba(255,255,255,.14);color:#fff;position:relative}
.start .btn{position:relative;background:#fff;color:var(--purple-600);border-color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fcard{padding:22px;min-width:0;display:flex;flex-direction:column}
.fcard h2{font-size:19px;margin:16px 0 6px}
.dom{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.fnum{padding:18px 0 18px}.fnum strong{display:block;font:800 34px/1 var(--display);letter-spacing:-.04em}.fnum small{color:var(--muted)}
.ep{display:flex;align-items:center;gap:6px;background:var(--canvas);border-radius:11px;padding:4px 4px 4px 12px;min-width:0}
.ep code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.add{border:2px dashed var(--line-2);border-radius:var(--r);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--purple);background:#fcfaff;text-align:center;padding:20px}
.add:hover{border-color:var(--purple);background:var(--purple-50)}
.add span{color:var(--muted);font-size:13px}
.info{display:flex;gap:12px;background:var(--purple-50);border:1px solid #d8c7f3;color:#5b3a8c;border-radius:14px;padding:15px;margin-bottom:20px}
.info p{font-size:13px}
.tw{overflow-x:auto}
.tr{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:18px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:640px;border-radius:10px}
button.tr:hover{background:var(--purple-50)}
.tr strong,.tr small{display:block}.tr small{color:var(--muted)}
.tr.h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#7a6c90;font-weight:700;padding-bottom:10px}
.bill{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.pricing{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.pc{padding:24px 20px;display:flex;flex-direction:column}
.pc.ft{border:2px solid var(--purple);box-shadow:0 18px 40px -18px rgba(96,32,200,.5)}
.price{font:800 44px/1 var(--display);letter-spacing:-.05em;margin:18px 0 8px}
.price small{font:400 13px var(--body);color:var(--muted);letter-spacing:0;margin-left:5px}
.pc ul{list-style:none;padding:0;display:grid;gap:13px;margin:20px 0 26px;font-size:13.5px}
.pc li{display:flex;align-items:center;gap:9px}.pc li svg{color:var(--purple)}
.pc .btn{margin-top:auto;width:100%}
.setp{max-width:680px}
.docs{max-width:860px}
.docs h2{font-size:30px;margin:16px 0 10px}.docs h3{margin:30px 0 8px;font-size:17px}.docs p{color:#51475f;margin-bottom:10px}
.docs code{background:var(--purple-100);padding:1px 6px;border-radius:6px;font-size:12.5px}
.code{position:relative;background:#1c0f33;color:#efe6ff;border-radius:14px;padding:20px 52px 20px 18px;margin:12px 0 20px}
.code pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace}
.code .ibtn{position:absolute;right:8px;top:8px;color:#e9defa;background:rgba(255,255,255,.1)}
.code .ibtn:hover{background:rgba(255,255,255,.2)}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.foot{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:12.5px;padding:34px 0 0}
.foot span{margin-right:auto}.foot a,.foot button{color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-size:12.5px}
.foot a:hover,.foot button:hover{color:var(--purple)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 14px 40px rgba(28,15,51,.35);max-width:calc(100% - 30px)}
.toast svg{color:#a6f0c8}.toast button{color:#c9b8e6;display:flex}

.modal{background:#fff;border-radius:22px;padding:28px;width:500px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 100px rgba(28,15,51,.4)}
.modal .ph h2{font-size:22px}.modal p{font-size:14px;color:#51475f;margin-bottom:12px}
.alist{display:grid;gap:12px}
.err{color:#b63748;font-size:13px;margin:6px 0}

/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100vh - 52px)}
.story{background:linear-gradient(160deg,var(--ink) 0%,#2f1566 100%);color:#e9defa;padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:50px;position:relative;overflow:hidden}
.story:before{content:'';position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(138,77,255,.55),transparent 68%)}
.story>*{position:relative}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#b79bec}
.story h1{font-size:46px;line-height:1.1;font-weight:800;color:#fff;margin:18px 0}
.story p{max-width:430px;font-size:16px;color:#cfc0ea}
.prom{display:flex;align-items:center;gap:10px;margin-top:28px;font-size:14px;color:#fff}
.prom svg{color:#b79bec}
.demo{display:inline-flex;align-items:center;gap:10px;color:#fff;font-weight:600;width:fit-content}
.demo:hover{text-decoration:underline}
.amain{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:50px 30px;background:#fff}
.acard{width:100%;max-width:400px}
.acard .eyebrow{color:var(--purple)}
.acard h2{font-size:32px;margin:12px 0 8px}
.acard>p{color:var(--muted)}
.asub{width:100%;margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px}
.links button{color:var(--purple);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px}
.links button:hover{text-decoration:underline}
.amsg{padding:13px 15px;border-radius:12px;font-size:13px;margin:16px 0}
.amsg.ok{background:var(--green-bg);color:#245b39;border:1px solid #9fcfb3}
.sec{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:12px;margin:18px 0;font-size:13px;color:#51405e;cursor:pointer}
.sec input{width:18px;height:18px;accent-color:var(--purple)}
.credit{font-size:12.5px;color:var(--muted)}

@media(max-width:1180px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pricing{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
  .inbox{grid-template-columns:minmax(340px,50%) 1fr}
}
@media(max-width:960px){
  .side{position:fixed;top:52px;left:0;transform:translateX(-102%);transition:transform .22s;box-shadow:20px 0 50px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:52px 0 0 0;background:rgba(28,15,51,.5);z-index:35}
  .burger{display:inline-grid}
  .top,.wrap{padding-left:20px;padding-right:20px}
  .auth{grid-template-columns:1fr}.story{padding:30px;gap:28px}.story h1{font-size:34px}
  .live .t{display:none}
}
@media(max-width:700px){
  .pbar small{display:none}.pbar{gap:10px;padding:0 12px}.pbar span{display:none}
  .head h1{font-size:26px}.acts{width:100%}.acts .btn{flex:1}
  .fgrid,.pricing{grid-template-columns:1fr}
  .inbox{display:block}.dp{display:none;padding:20px 18px}.inbox.det .lp{display:none}.inbox.det .dp{display:block}

  .story>div:nth-child(2){display:none}.story{padding:22px;gap:14px}
  .foot{flex-wrap:wrap;gap:12px}.foot span{width:100%}
  .alert{flex-wrap:wrap}.alert button{margin-left:30px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function deliveries(){
 var ns=S.msgs.filter(function(m){return !m.spam});

function settings(){
 return '<section class="card pad setp"><h2>Your workspace</h2><form data-f="settings"><label class="field">Your name<input name="name" value="'+esc(S.set.name)+'" required maxlength="80"></label><label class="field">Workspace name<input name="workspace" value="'+esc(S.set.workspace)+'" required maxlength="80"></label><label class="field">Display email<input name="email" type="email" value="'+esc(S.set.email)+'" required></label><p class="muted">These preferences only change this local preview. They do not verify an address or change notification recipients.</p><div style="margin-top:16px"><button class="btn pri">Save preferences</button></div></form><hr><h3>Sample data</h3><p class="muted" style="margin:6px 0 14px">Restore the original forms, messages, and preferences.</p><button class="btn dng" data-a="modal" data-t="reset">Reset preview</button></section>';

function docs(){
 return '<section class="card pad docs">'+badge('HTML · REACT · ANY WEBSITE')+'<h2>One endpoint. Your own form.</h2><p>The production service will accept a POST request from your existing form. All submitted fields will appear in your inbox.</p><div class="info">'+ic('alert',20)+'<p>The example below is a placeholder. This frontend preview does not yet expose a live submission endpoint.</p></div>'+
 '<h3>1. Create a form</h3><p>Choose a name, your website domain, and a notification address.</p><button class="btn" data-a="modal" data-t="create">'+ic('plus',16)+'Create form</button>'+
 '<h3>2. Connect your website</h3><p>After backend deployment, replace the placeholder URL with the real endpoint from your form settings. Every input needs a <code>name</code> attribute.</p>'+
 codeBlock('<form action="https://YOUR-PENTREEFORM-DOMAIN/f/YOUR-FORM-ID" method="POST">\n  <input name="name" required placeholder="Your name" />\n  <input type="email" name="email" required />\n  <textarea name="message" required></textarea>\n  <button type="submit">Send message</button>\n</form>')+
 '<h3>3. Test the flow</h3><p>For now, use “Test locally” on a form card. Once the backend is connected, submit from your website and confirm both inbox storage and email delivery.</p><h3>What comes next</h3><p>Verified accounts, tenant access controls, real endpoints, spam checks, durable email jobs, provider delivery events, subscriptions, and account limits.</p></section>';
}
function modalView(){
 var m=S.modal;if(!m)return '';var t=m.t,title={archive:'Archive this form?',create:'Create a form',setup:'Form setup',actions:'Message actions',reset:'Reset this preview?',del:'Delete submission?',privacy:'About this preview'}[t],body='';
 if(t==='create')body='<form data-f="create"><p>Create a local form configuration. You can test it with sample submissions.</p><label class="field">Form name<input name="name" required maxlength="80" placeholder="e.g. Contact form"></label><label class="field">Website domain<input name="domain" required placeholder="example.com"></label><label class="field">Notification email<input name="email" type="email" required placeholder="you@example.com"></label>'+(m.err?'<p class="err" role="alert">'+esc(m.err)+'</p>':'')+'<button class="btn pri" type="submit">'+ic('plus',17)+'Create form</button></form>';
 else if(t==='setup'){var f=S.forms.filter(function(x){return x.id===m.v})[0]||S.forms[0];body=badge('Local configuration')+'<p style="margin-top:12px">This form is configured for the preview. Its public endpoint is not live yet.</p><label class="field">Form name<input readonly value="'+esc(f.name)+'"></label><label class="field">Website domain<input readonly value="'+esc(f.domain)+'"></label><label class="field">Notification recipient<input readonly value="'+esc(f.email)+'"></label><h3>Endpoint placeholder</h3>'+codeBlock(ep(f.id))+'<button class="btn pri" data-a="testlocal" data-v="'+esc(f.id)+'">Add a sample submission</button>'}
 else if(t==='actions'){var cm=S.msgs.filter(function(x){return x.id===m.v})[0];body='<div class="alist"><button class="btn" data-a="spamtoggle" data-v="'+m.v+'">'+ic('shield',17)+(cm&&cm.spam?'Move to inbox':'Move to spam')+'</button><button class="btn dng" data-a="modal" data-t="del" data-v="'+m.v+'">'+ic('trash',17)+'Delete submission</button></div>'}
 else if(t==='del')body='<p>Delete this sample submission from this browser? This cannot be undone.</p><button class="btn dng" data-a="delmsg" data-v="'+m.v+'">Delete submission</button>';
 else if(t==='reset')body='<p>This replaces local forms, messages, and workspace settings with the original sample data.</p><button class="btn dng" data-a="doreset">Reset sample data</button>';
 else body='<p>This interactive frontend stores sample messages and workspace preferences in your browser’s local storage. It does not send them to a server.</p><p>Use fictional data while testing. Anyone using this browser profile can access the saved preview. You can clear it in Settings.</p><p>Production privacy terms and account security will be added with the backend.</p>';
 return '<div class="mb" data-a="mbclose"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" tabindex="-1"><div class="ph"><h2 id="mt">'+title+'</h2><button class="ibtn" aria-label="Close dialog" data-a="close">'+ic('x',20)+'</button></div>'+body+'</section></div>';
}
function dashboard(){
 var pg=S.page,tt=TITLES[pg],body='';
 if(pg==='Inbox')body=stats()+inbox();else if(pg==='Overview')body=stats()+overview();else if(pg==='Forms')body=formsPage();else if(pg==='Deliveries')body=deliveries();else if(pg==='Usage & billing')body=billing();else if(pg==='Settings')body=settings();else body=docs();
 var hasActs=['Inbox','Forms','Overview'].indexOf(pg)>-1;
 return '<div class="shell">'+sidebar()+'<main class="main"><header class="top"><button class="ibtn burger" aria-label="Open navigation" data-a="navopen">'+ic('menu')+'</button><span class="crumb">Workspace<i>/</i><b>'+pg+'</b></span><span class="grow"></span><span class="live"><i></i><span class="t">Interactive preview · sample data</span></span><button class="ibtn" aria-label="Open documentation" data-a="nav" data-v="Documentation">'+ic('book',18)+'</button></header>'+
 '<div class="wrap"><div class="head"><div><h1>'+tt[0]+'</h1><p>'+tt[1]+'</p></div>'+(hasActs?'<div class="acts"><button class="btn" data-a="export">'+ic('dl',17)+'Export</button><button class="btn pri" data-a="modal" data-t="create">'+ic('plus',19)+'Create form</button></div>':'')+'</div>'+body+
 '<footer class="foot"><span>© '+new Date().getFullYear()+' Pentreeform</span><a href="https://www.beepeelabs.cv/" target="_blank" rel="noreferrer">Built by BeepeeLabs '+ic('ur',13)+'</a><button data-a="modal" data-t="privacy">Preview privacy</button></footer></div></main></div>';
}
function auth(){
 var m=S.mode,v=S.screen==='verify',need=['register','forgot','resend'].indexOf(m)>-1||v;
 var title=v?'Verify your email':{login:'Welcome back.',register:'Give your forms a home.',forgot:'Reset your password.',resend:'Get a fresh verification link.',reset:'Choose a new password.'}[m];
 var sub=v?'A verification link was sent to you@example.com. Open it to activate your workspace.':m==='register'?'Start with 100 submissions per month, free.':m==='login'?'Sign in to your workspace.':'We’ll help you get back to your workspace.';
 var f='';
 if(!v&&m==='register')f+='<label class="field">Your name<input name="name" required maxlength="80" autocomplete="name"></label><label class="field">Workspace name<input name="workspace" required maxlength="80" placeholder="Your business or project"></label>';
 if(!v&&m!=='reset')f+='<label class="field">Email address<input name="email" type="email" required autocomplete="email"></label>';
 if(!v&&['login','register','reset'].indexOf(m)>-1)f+='<label class="field">Password<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="'+(m==='login'?'current-password':'new-password')+'">'+(m!=='login'?'<small>Use at least 12 characters.</small>':'')+'</label>';
 if(need)f+='<label class="sec"><input type="checkbox" data-sec'+(S.tok?' checked':'')+'>Security check placeholder · UI preview</label>';
 var lbl=v?'Resend verification':{login:'Sign in',register:'Create account',forgot:'Send reset link',resend:'Send verification link',reset:'Update password'}[m];
 var links=v?'<button data-a="screen" data-v="login">'+ic('out',14)+'Sign out</button>':(m==='login'?'<button data-a="mode" data-v="register">Create an account</button><button data-a="mode" data-v="forgot">Forgot password?</button><button data-a="mode" data-v="resend">Resend verification</button>':'<button data-a="mode" data-v="login">Back to sign in</button>');
 return '<div class="auth"><section class="story">'+logo()+'<div><span class="eyebrow">FORMS, WITHOUT THE BACKEND WORK.</span><h1>Your website enquiries.<br>All accounted for.</h1><p>Connect your form, keep every message, and see what happened to the notification.</p><div class="prom">'+ic('shieldc',20)+'<span>Saved first. Sent second.</span></div></div><button class="demo" data-a="screen" data-v="dashboard">Explore the dashboard demo '+ic('right',17)+'</button></section>'+
 '<section class="amain"><div class="acard"><span class="eyebrow">PENTREEFORM</span><h2>'+title+'</h2><p>'+sub+'</p>'+(S.amsg?'<div role="status" class="amsg ok">'+esc(S.amsg)+'</div>':'')+
 '<form data-f="auth">'+f+'<button class="btn pri asub" type="submit"'+((need&&!S.tok)?' disabled':'')+'>'+lbl+ic('right',17)+'</button></form><div class="links">'+links+'</div></div><p class="credit">Built by <a href="https://www.beepeelabs.cv/" target="_blank" rel="noreferrer">BeepeeLabs</a></p></section></div>';
}
function pbar(){
 var o=[['dashboard','Dashboard & all app pages'],['login','Sign in'],['register','Create account'],['forgot','Forgot password'],['resend','Resend verification'],['reset','Reset password'],['verify','Verify email']];
 return '<div class="pbar"><b>Pentreeform <span>UI preview</span></b><label>Screen<select data-c="screen" aria-label="Choose UI screen">'+o.map(function(x){return '<option value="'+x[0]+'"'+(S.screen===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label><small>Works offline · sample data only</small></div>';
}
function render(){
 var a=document.activeElement,keepQ=a&&a.id==='q',pos=keepQ?a.selectionStart:0;
 document.getElementById('root').innerHTML=pbar()+(S.screen==='dashboard'?dashboard():auth())+modalView()+(S.toast?'<div role="status" class="toast">'+ic('cok',18)+esc(S.toast)+'<button aria-label="Dismiss notification" data-a="toastx">'+ic('x',16)+'</button></div>':'');
 document.title='Pentreeform · '+(S.screen==='dashboard'?S.page:'Account');
 if(keepQ){var q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(pos,pos)}}
 if(S.modal){var d=document.querySelector('.modal');if(d)d.focus()}
}
function go(p){S.page=p;S.nav=false;S.detail=false;render();window.scrollTo(0,0)}
function setScreen(s){S.screen=s;S.amsg='';S.tok=false;S.modal=null;S.mode=(s==='verify'||s==='dashboard')?'resend':s;render()}

/* ---------- events ---------- */
var R=document.getElementById('root');
R.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 var a=t.getAttribute('data-a'),v=t.getAttribute('data-v');
 if(a==='mbclose'){if(e.target!==t)return;S.modal=null;return render()}
 switch(a){
  case 'nav':go(v);break;
  case 'navopen':S.nav=true;render();break;
  case 'navclose':S.nav=false;render();break;
  case 'tab':S.tab=v;S.chk=[];render();break;
  case 'bulk':S.msgs=S.msgs.map(function(m){return S.chk.indexOf(m.id)>-1?Object.assign({},m,{read:true}):m});S.chk=[];persist();toast('Selected messages marked as read');break;
  case 'open':S.sel=v;upd(v,{read:true});S.detail=true;render();break;
  case 'back':S.detail=false;render();break;
  case 'clear':S.q='';S.ff='all';S.tab='All';S.df='all';render();break;
  case 'toggleread':var cm=S.msgs.filter(function(m){return m.id===v})[0];upd(v,{read:!cm.read});render();break;
  case 'copy':copy(v);break;
  case 'modal':S.modal={t:t.getAttribute('data-t'),v:v};render();break;
  case 'close':S.modal=null;render();break;
  case 'toastx':S.toast='';render();break;
  case 'spamtoggle':var sm=S.msgs.filter(function(m){return m.id===v})[0];upd(v,{spam:!sm.spam});S.modal=null;toast(sm.spam?'Moved to inbox':'Moved to spam');break;
  case 'delmsg':S.msgs=S.msgs.filter(function(m){return m.id!==v});S.sel=null;S.modal=null;S.detail=false;persist();toast('Submission deleted');break;
  case 'doreset':S.forms=FORMS0;S.msgs=MSG0;S.set=SET0;S.sel='m0';S.modal=null;persist();toast('Preview reset');break;
  case 'formjump':S.ff=v;go('Inbox');break;
  case 'deljump':S.sel=v;S.page='Inbox';S.detail=true;render();break;
  case 'testlocal':var f=S.forms.filter(function(x){return x.id===v})[0];var nm={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name:'Test Visitor',email:'visitor@example.com',formId:f.id,subject:'Your form preview works',message:'This sample submission was created locally to preview your inbox. A live endpoint and email service have not been connected yet.',date:new Date().toISOString(),delivery:'not-connected',read:false,spam:false};S.msgs=[nm].concat(S.msgs);S.sel=nm.id;S.ff='all';S.tab='All';S.modal=null;S.page='Inbox';persist();toast('Sample submission added. No email was sent.');break;
  case 'plan':toast('Plan preview only. Checkout will be enabled after billing is connected.');break;
  case 'export':exportCSV();break;
  case 'screen':setScreen(v);break;
  case 'mode':S.mode=v;S.amsg='';S.tok=false;render();break;
 }
});
R.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;render()}});
R.addEventListener('change',function(e){
 var t=e.target;
 if(t.hasAttribute('data-k')){var id=t.getAttribute('data-k');S.chk=t.checked?S.chk.concat(id):S.chk.filter(function(x){return x!==id});render();return}
 if(t.hasAttribute('data-sec')){S.tok=t.checked;render();return}
 var c=t.getAttribute('data-c');
 if(c==='screen')setScreen(t.value);
 else if(c==='ff'){S.ff=t.value;render()}
 else if(c==='df'){S.df=t.value;render()}
});
R.addEventListener('submit',function(e){
 var f=e.target.getAttribute('data-f');if(!f)return;e.preventDefault();
 var d=new FormData(e.target);
 if(f==='settings'){S.set={name:d.get('name').trim(),workspace:d.get('workspace').trim(),email:d.get('email').trim()};persist();toast('Workspace preferences saved in this browser')}
 else if(f==='create'){
  var dom=d.get('domain').trim();
  try{var u=new URL(dom.indexOf('://')>-1?dom:'https://'+dom);if(['https:','http:'].indexOf(u.protocol)<0||u.hostname.indexOf('.')<0)throw 0;dom=u.hostname}catch(x){S.modal={t:'create',err:'Enter a valid website domain, such as example.com.'};render();return}
  var nf={id:(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,16):String(Date.now())),name:d.get('name').trim(),domain:dom,email:d.get('email').trim()};
  S.forms=S.forms.concat(nf);persist();S.modal={t:'setup',v:nf.id};toast('Form configuration saved locally');
 }
 else if(f==='auth'){
  if(S.mode==='login'&&S.screen!=='verify'){setScreen('dashboard');S.page='Inbox';render();return}
  S.amsg='UI preview only. No accounts are created and no email is sent.';
  if(S.mode==='reset'){S.mode='login';S.screen='login'}
  S.tok=false;render();
 }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

function exportCSV(){
 var rows=[['Name','Email','Form','Subject','Message','Received','Delivery']].concat(filtered().map(function(m){return [m.name,m.email,formName(m.formId),m.subject,m.message,m.date,m.delivery]}));
 var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
 var url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');
 a.href=url;a.download='pentreeform-submissions.csv';a.click();URL.revokeObjectURL(url);
 toast('Exported '+(rows.length-1)+' submissions');
}
render();
})();
</script>
